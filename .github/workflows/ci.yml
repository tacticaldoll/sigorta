name: ci

on:
  push:
  pull_request:

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build / test / clippy / fmt / doc
        run: |
          cargo build --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          cargo run --example keyed_by_job_kind -p sigorta-contract
      - name: changelog ledger
        run: ./scripts/changelog-guard.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install and select the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88
      - name: workspace builds on the declared MSRV
        run: cargo +1.88 build --workspace
      # sigorta-governance is excluded: it is a publish=false dev tool, not part of
      # the published-crate MSRV contract.
      - name: install the published crates' floor toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: published crates check on their declared floor (1.85)
        run: cargo +1.85 check --workspace --exclude sigorta-governance --all-targets

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: license / advisory / bans / sources policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  governance:
    name: Tianheng reaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: architecture constitution passes
        run: cargo run -p sigorta-governance -- check --manifest-path Cargo.toml
