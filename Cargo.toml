[workspace]
resolver = "2"
members = ["crates/sigorta-contract", "crates/sigorta", "crates/sigorta-governance"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacticaldoll/sigorta"
keywords = ["circuit-breaker", "sans-io", "state-machine", "resilience"]
categories = ["rust-patterns"]

[workspace.dependencies]
tianheng = "0.6.1"
sigorta-contract = { path = "crates/sigorta-contract", version = "0.1.3" }
